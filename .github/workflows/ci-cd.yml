name: CI/CD

# Rama test y pull requests hacia main: sólo compila y prueba (CI).
# Push a main: además crea/actualiza la infraestructura en Azure, construye la imagen, despliega la API y la verifica (CD).
on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: 10.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore -c Release

      - name: Pruebas unitarias
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=resultados.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: "**/resultados.trx"

  desplegar:
    name: Infraestructura y despliegue en Azure
    needs: build-test
    # Sólo main despliega: test y los pull requests nunca tocan Azure, aunque se lance el workflow a mano.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: produccion
    # OIDC: GitHub obtiene un token de corta vida de Azure; no hay contraseñas de Azure guardadas en el repo.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Paso 1: todo menos la Container App (todavía no existe una imagen que correr).
      - name: Infraestructura (Bicep, fase 1)
        id: infra
        uses: azure/arm-deploy@v2
        with:
          deploymentName: infra-${{ github.run_number }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >-
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            jwtKey=${{ secrets.JWT_KEY }}
            adminEmail=${{ vars.ADMIN_EMAIL }}
            adminPassword=${{ secrets.ADMIN_PASSWORD }}

      - name: Login en el Container Registry
        run: az acr login --name ${{ steps.infra.outputs.nombreAcr }}

      # Se construye acá (docker en el runner) y no con "az acr build": las ACR Tasks no están
      # disponibles en suscripciones de prueba gratuita.
      - name: Construir y subir la imagen
        run: |
          imagen="${{ steps.infra.outputs.servidorAcr }}/alquilercanchas-api:${{ github.sha }}"
          docker build -t "$imagen" .
          docker push "$imagen"

      # Paso 2: misma plantilla, ahora con la imagen: crea o actualiza la Container App.
      - name: Desplegar la API (Bicep, fase 2)
        id: app
        uses: azure/arm-deploy@v2
        with:
          deploymentName: app-${{ github.run_number }}
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: ./infra/main.bicep
          parameters: >-
            sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}
            jwtKey=${{ secrets.JWT_KEY }}
            adminEmail=${{ vars.ADMIN_EMAIL }}
            adminPassword=${{ secrets.ADMIN_PASSWORD }}
            imagen=${{ steps.infra.outputs.servidorAcr }}/alquilercanchas-api:${{ github.sha }}

      - name: Verificar que la API responde
        run: |
          url="${{ steps.app.outputs.urlApi }}"
          # El primer arranque aplica migraciones y puede tardar: se reintenta hasta 12 veces.
          for i in $(seq 1 12); do
            codigo=$(curl -s -o /dev/null -w "%{http_code}" "$url/health" || true)
            echo "Intento $i: HTTP $codigo"
            [ "$codigo" = "200" ] && echo "API en línea: $url" && exit 0
            sleep 15
          done
          echo "La API no respondió 200 en /health"; exit 1
